<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grouped Bar Chart - Price by Review Score</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: Montserrat, Arial, sans-serif;
      margin: 40px;
      background: #fafafa;
    }
    h2 { color: #FF5A5F; }
    svg {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .tooltip {
      position: absolute;
      background: white;
      border: 1px solid #FF5A5F;
      border-radius: 4px;
      padding: 10px;
      pointer-events: none;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      opacity: 0;
    }
    .bar:hover {
      opacity: 1;
      stroke: #333;
      stroke-width: 2;
    }
    .legend {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>Average Price per Night by Review Score Category</h2>
  <label for="roomTypeSelect">Choose Room Type:</label>
  <select id="roomTypeSelect"></select>
  <svg id="chart" width="900" height="500"></svg>

  <script>
    const scoreCategories = ["1-2", "2-3", "3-4", "4-4.5", "4.5-5"];

    const tooltip = d3.select("body").append("div")
      .attr("class", "tooltip");

    d3.csv("../cleaned_listings.csv").then(data => {
      const filtered = data.filter(d =>
        !isNaN(+d.price_per_night) &&
        !isNaN(+d.review_scores_value) &&
        d.room_type
      );

      const roomTypes = [...new Set(filtered.map(d => d.room_type))];

      // Populate dropdown
      const select = d3.select("#roomTypeSelect");
      select.selectAll("option")
        .data(roomTypes)
        .enter()
        .append("option")
        .attr("value", d => d)
        .text(d => d);

      const svg = d3.select("#chart"),
            width = +svg.attr("width"),
            height = +svg.attr("height"),
            margin = {top: 20, right: 30, bottom: 60, left: 70};

      const chartWidth = width - margin.left - margin.right;
      const chartHeight = height - margin.top - margin.bottom;

      const g = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      function binScore(score) {
        if (score < 2) return "1-2";
        if (score < 3) return "2-3";
        if (score < 4) return "3-4";
        if (score < 4.5) return "4-4.5";
        return "4.5-5";
      }

      const color = d3.scaleOrdinal()
        .domain(roomTypes)
        .range(["#FF5A5F", "#00A699", "#484848", "#FC642D"]);

      // X scale for categories
      const x = d3.scaleBand()
        .domain(scoreCategories)
        .range([0, chartWidth])
        .padding(0.3);

      // Y scale for price
      const y = d3.scaleLinear()
        .domain([0, 400])
        .nice()
        .range([chartHeight, 0]);

      // X axis
      g.append("g")
        .attr("class", "x-axis")
        .attr("transform", `translate(0,${chartHeight})`)
        .call(d3.axisBottom(x));

      // Y axis
      const yAxisGroup = g.append("g")
        .attr("class", "y-axis")
        .call(d3.axisLeft(y).tickFormat(d => "$" + d));

      // Axis labels
      g.append("text")
        .attr("x", chartWidth / 2)
        .attr("y", chartHeight + 45)
        .attr("text-anchor", "middle")
        .text("Review Score Category");

      g.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -chartHeight / 2)
        .attr("y", -margin.left + 20)
        .attr("text-anchor", "middle")
        .text("Average Price per Night ($)");

      function updateChart(selectedRoomType) {
        // Calculate average price for selected room type
        const barData = scoreCategories.map(cat => {
          const listings = filtered.filter(d => 
            d.room_type === selectedRoomType && 
            binScore(+d.review_scores_value) === cat
          );
          const avgPrice = listings.length > 0 
            ? d3.mean(listings, d => +d.price_per_night) 
            : 0;
          const count = listings.length;
          return { category: cat, avgPrice, count };
        });

        // Update y scale domain
        const maxPrice = d3.max(barData, d => d.avgPrice) * 1.1;
        y.domain([0, Math.max(maxPrice, 100)]).nice();
        yAxisGroup.transition().duration(500).call(d3.axisLeft(y).tickFormat(d => "$" + d));

        // Binddata
        const bars = g.selectAll(".bar")
          .data(barData);

        // Remove old bars
        bars.exit().remove();

        // Add new bars and update existing
        bars.enter()
          .append("rect")
          .attr("class", "bar")
          .attr("x", d => x(d.category))
          .attr("width", x.bandwidth())
          .attr("y", chartHeight)
          .attr("height", 0)
          .attr("fill", color(selectedRoomType))
          .attr("opacity", 0.85)
          .on("mouseover", function(event, d) {
            tooltip.transition().duration(200).style("opacity", 1);
            tooltip.html(`
              <strong>Score: ${d.category}</strong><br/>
              Avg Price: ${d.avgPrice.toFixed(2)}<br/>
              Count: ${d.count} listings
            `)
            .style("left", (event.pageX + 15) + "px")
            .style("top", (event.pageY - 30) + "px");
          })
          .on("mousemove", function(event) {
            tooltip
              .style("left", (event.pageX + 15) + "px")
              .style("top", (event.pageY - 30) + "px");
          })
          .on("mouseout", function() {
            tooltip.transition().duration(300).style("opacity", 0);
          })
          .merge(bars)
          .transition()
          .duration(500)
          .attr("x", d => x(d.category))
          .attr("y", d => y(d.avgPrice))
          .attr("height", d => chartHeight - y(d.avgPrice))
          .attr("fill", color(selectedRoomType));
      }

      // Initial render
      updateChart(roomTypes[0]);

      // Update on dropdown change
      select.on("change", function() {
        updateChart(this.value);
      });
    });
  </script>
</body>
</html>
