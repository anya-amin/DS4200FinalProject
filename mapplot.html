<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D3 Airbnb Price Map</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .tooltip {
      position: absolute;
      background: white;
      border: 1px solid #FF5A5F;
      border-radius: 4px;
      padding: 8px;
      pointer-events: none;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .legend {
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Airbnb Prices & Density by Neighborhood</h2>
  <svg id="map" width="800" height="600"></svg>
  <div id="legend"></div>
  <div id="density-legend"></div>

  <!-- D3 library -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- External script -->
  <script src="map.js"></script>
</body>
</html>
